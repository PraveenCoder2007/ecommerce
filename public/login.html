<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - eStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <h1 class="logo">eStore</h1>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                    <a href="login.html" id="auth-link">Login</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showLogin()">Login</button>
                    <button class="tab-btn" onclick="showSignup()">Sign Up</button>
                </div>

                <form id="login-form" class="auth-form">
                    <h2>Login</h2>
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>

                <form id="signup-form" class="auth-form" style="display: none;">
                    <h2>Sign Up</h2>
                    <input type="text" id="signup-name" placeholder="Full Name" required>
                    <input type="email" id="signup-email" placeholder="Email" required>
                    <input type="password" id="signup-password" placeholder="Password" required>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </form>

                <div id="auth-message" class="message"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 eStore. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
